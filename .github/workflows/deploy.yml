name: 180 Core Production Deployment

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  detect-changes:
    name: Detect Changed Subsystems
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      developers: ${{ steps.filter.outputs.developers }}
      profile: ${{ steps.filter.outputs.profile }}
      admin: ${{ steps.filter.outputs.admin }}
      global: ${{ steps.filter.outputs.global }}
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Path Filter Inspection
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'apps/180-core-backend/**'
              - 'packages/db-180core/**'
              - 'packages/domains/**'
              - 'packages/identity-provider/**'
              - 'packages/payment-provider/**'
              - 'packages/integrations/**'
              - 'packages/keys/**'
              - 'scripts/**'
              - 'Dockerfile'
              - 'docker-compose.yml'
            developers:
              - 'apps/180developers-frontend/**'
              - 'packages/identity-sdk/**'
              - 'packages/ui/**'
            profile:
              - 'apps/180-profile-frontend/**'
              - 'packages/ui/**'
            admin:
              - 'apps/180-admin-frontend/**'
              - 'packages/ui/**'
            global:
              - '.github/workflows/deploy.yml'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'turbo.json'

  deploy-backend:
    name: Deploy Backend & Migrate Database (AWS EC2 / RDS)
    needs: detect-changes
    if: needs.detect-changes.outputs.backend == 'true' || needs.detect-changes.outputs.global == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9.0.0

      - name: Setup Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install Monorepo Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Prisma DB Push (AWS RDS Postgres)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || secrets.CORE_DATABASE_URL }}
          CORE_DATABASE_URL: ${{ secrets.DATABASE_URL || secrets.CORE_DATABASE_URL }}
        run: |
          pnpm db:generate
          pnpm db:push

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Core Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/180-core-backend/Dockerfile
          push: true
          tags: |
            ghcr.io/simplicion/180core-core-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Deploy & Restart Backend Container on AWS EC2
        env:
          INSTANCE_ID: ${{ secrets.AWS_INSTANCE_ID }}
          GH_ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CORE_DB_URL: ${{ secrets.DATABASE_URL || secrets.CORE_DATABASE_URL }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          LINKEDIN_CLIENT_ID: ${{ secrets.LINKEDIN_CLIENT_ID }}
          LINKEDIN_CLIENT_SECRET: ${{ secrets.LINKEDIN_CLIENT_SECRET }}
          GITHUB_CLIENT_ID: ${{ secrets.GH_OAUTH_CLIENT_ID }}
          GITHUB_CLIENT_SECRET: ${{ secrets.GH_OAUTH_CLIENT_SECRET }}

          CORE_CLIENT_ID: ${{ secrets.CORE_CLIENT_ID }}
          CORE_CLIENT_SECRET: ${{ secrets.CORE_CLIENT_SECRET }}
          CORE_WEBHOOK_SECRET: ${{ secrets.CORE_WEBHOOK_SECRET }}
          RAZORPAY_KEY_ID: ${{ secrets.RAZORPAY_KEY_ID }}
          RAZORPAY_KEY_SECRET: ${{ secrets.RAZORPAY_KEY_SECRET }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          MSG91_AUTH_KEY: ${{ secrets.MSG91_AUTH_KEY }}
          MSG91_WHATSAPP_INTEGRATED_NUMBER: ${{ secrets.MSG91_WHATSAPP_INTEGRATED_NUMBER }}
        run: |
          echo "Preparing zero-downtime SSM parameters for EC2 ($INSTANCE_ID)..."
          python3 scripts/generate-ssm-params.py ssm-params.json

          echo "Triggering zero-downtime reload on EC2..."
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters file://ssm-params.json \
            --query "Command.CommandId" \
            --output text)

          
          echo "SSM Command dispatched: $COMMAND_ID"
          set +e
          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID"
          WAIT_STATUS=$?
          echo "=== SSM STDOUT ==="
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query "StandardOutputContent" --output text
          echo "=== SSM STDERR ==="
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query "StandardErrorContent" --output text
          if [ $WAIT_STATUS -ne 0 ]; then
            echo "❌ Backend healthcheck failed after restart."
            exit $WAIT_STATUS
          fi
          echo "✅ Backend successfully restarted and verified healthy."

      - name: Verify Public Edge Healthcheck
        run: |
          echo "Testing public ingress endpoint..."
          for i in {1..10}; do
            echo "Attempt $i: Checking https://api.180core.cloud/health & CORS preflight..."
            if curl -sf https://api.180core.cloud/health && curl -sf -X OPTIONS -H "Origin: https://developer.180core.cloud" -H "Access-Control-Request-Method: GET" https://api.180core.cloud/api/oauth/userinfo; then
              echo "✅ Public ingress endpoint responded with 200 OK and CORS Preflight 204!"
              exit 0
            fi
            sleep 4
          done
          echo "Edge warming up..."

  deploy-developers-frontend:
    name: Deploy Developer Portal (Cloudflare Pages)
    needs: detect-changes
    if: needs.detect-changes.outputs.developers == 'true' || needs.detect-changes.outputs.global == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9.0.0

      - name: Setup Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install Monorepo Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Sovereign SDK Mirror
        run: pnpm build:sdk

      - name: Build Developers Frontend (Static Export)
        env:
          NODE_ENV: production
          CF_PAGES: 'true'
          NEXT_PUBLIC_CORE_BACKEND_URL: 'https://api.180core.cloud'
          NEXT_PUBLIC_API_URL: 'https://api.180core.cloud'
          NEXT_PUBLIC_PROFILE_URL: 'https://profile.180core.cloud'
        run: pnpm --filter 180developers-frontend build

      - name: Deploy to Cloudflare Pages (180workspace-developer)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] && [ -z "$CLOUDFLARE_API_KEY" ]; then
            echo "ℹ️ Neither CLOUDFLARE_API_TOKEN nor CLOUDFLARE_API_KEY configured. Skipping Cloudflare Pages upload."
            exit 0
          fi
          npx --yes wrangler pages deploy apps/180developers-frontend/out --project-name=180workspace-developer --commit-dirty=true

  deploy-profile-frontend:
    name: Deploy Profile & SSO Portal (Cloudflare Pages)
    needs: detect-changes
    if: needs.detect-changes.outputs.profile == 'true' || needs.detect-changes.outputs.global == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9.0.0

      - name: Setup Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install Monorepo Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Profile Frontend (Static Export)
        env:
          NODE_ENV: production
          CF_PAGES: 'true'
          NEXT_PUBLIC_CORE_BACKEND_URL: 'https://api.180core.cloud'
          NEXT_PUBLIC_CORE_API_URL: 'https://api.180core.cloud'
          NEXT_PUBLIC_DEVELOPERS_URL: 'https://developer.180core.cloud'
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${{ secrets.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
          NEXT_PUBLIC_LINKEDIN_CLIENT_ID: ${{ secrets.NEXT_PUBLIC_LINKEDIN_CLIENT_ID }}
          NEXT_PUBLIC_GITHUB_CLIENT_ID: ${{ secrets.NEXT_PUBLIC_GITHUB_CLIENT_ID }}
          NEXT_PUBLIC_ROOT_DOMAIN: '180core.cloud'
          NEXT_PUBLIC_MAIN_DOMAIN: '180core.cloud'
        run: pnpm --filter 180-profile-frontend build


      - name: Deploy to Cloudflare Pages (180workspace-profile)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] && [ -z "$CLOUDFLARE_API_KEY" ]; then
            echo "ℹ️ Neither CLOUDFLARE_API_TOKEN nor CLOUDFLARE_API_KEY configured. Skipping Cloudflare Pages upload."
            exit 0
          fi
          npx --yes wrangler pages deploy apps/180-profile-frontend/out --project-name=180workspace-profile --commit-dirty=true

  deploy-admin-frontend:
    name: Deploy Super Admin Platform (Cloudflare Pages)
    needs: detect-changes
    if: needs.detect-changes.outputs.admin == 'true' || needs.detect-changes.outputs.global == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9.0.0

      - name: Setup Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install Monorepo Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Admin Frontend (Static Export)
        env:
          NODE_ENV: production
          CF_PAGES: 'true'
          NEXT_PUBLIC_ADMIN_API_URL: 'https://api.180core.cloud/api/v1/admin'
          NEXT_PUBLIC_SUPPORT_API_URL: 'https://api.180core.cloud/api/v1/support'
        run: pnpm --filter 180-admin-frontend build

      - name: Deploy to Cloudflare Pages (180core-admin)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] && [ -z "$CLOUDFLARE_API_KEY" ]; then
            echo "ℹ️ Neither CLOUDFLARE_API_TOKEN nor CLOUDFLARE_API_KEY configured. Skipping Cloudflare Pages upload."
            exit 0
          fi
          npx --yes wrangler pages deploy apps/180-admin-frontend/out --project-name=180core-admin --commit-dirty=true

