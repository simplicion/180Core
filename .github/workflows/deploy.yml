name: 180 Core Production Deployment

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  detect-changes:
    name: Detect Changed Subsystems
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      developers: ${{ steps.filter.outputs.developers }}
      profile: ${{ steps.filter.outputs.profile }}
      admin: ${{ steps.filter.outputs.admin }}
      global: ${{ steps.filter.outputs.global }}
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Path Filter Inspection
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'apps/180-core-backend/**'
              - 'packages/db-180core/**'
              - 'packages/domains/**'
              - 'packages/identity-provider/**'
              - 'packages/payment-provider/**'
              - 'packages/integrations/**'
              - 'packages/keys/**'
              - 'Dockerfile'
              - 'docker-compose.yml'
            developers:
              - 'apps/180developers-frontend/**'
              - 'packages/identity-sdk/**'
              - 'packages/ui/**'
            profile:
              - 'apps/180-profile-frontend/**'
              - 'packages/ui/**'
            admin:
              - 'apps/180-admin-frontend/**'
              - 'packages/ui/**'
            global:
              - '.github/workflows/deploy.yml'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'turbo.json'

  deploy-backend:
    name: Deploy Backend & Migrate Database (AWS EC2 / RDS)
    needs: detect-changes
    if: needs.detect-changes.outputs.backend == 'true' || needs.detect-changes.outputs.global == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9.0.0

      - name: Setup Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install Monorepo Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Prisma DB Push (AWS RDS Postgres)
        env:
          CORE_DATABASE_URL: ${{ secrets.CORE_DATABASE_URL }}
        run: |
          pnpm db:generate
          pnpm db:push

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Core Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/180-core-backend/Dockerfile
          push: true
          tags: |
            ghcr.io/simplicion/180core-core-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Deploy & Restart Backend Container on AWS EC2
        env:
          INSTANCE_ID: ${{ secrets.AWS_INSTANCE_ID }}
          GH_ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CORE_DB_URL: ${{ secrets.CORE_DATABASE_URL }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          echo "Preparing zero-downtime SSM parameters for EC2 ($INSTANCE_ID)..."
          SSM_PARAMS=$(jq -n \
            --arg token "$GH_TOKEN" \
            --arg actor "$GH_ACTOR" \
            --arg coreDb "$CORE_DB_URL" \
            --arg googleId "$GOOGLE_CLIENT_ID" \
            --arg googleSecret "$GOOGLE_CLIENT_SECRET" \
            --arg hostHdr "Host: api.180core.cloud" \
            '{commands: [
              "echo === 1. DOCKER LOGIN GHCR ===",
              ("echo " + ($token | @sh) + " | docker login ghcr.io -u " + ($actor | @sh) + " --password-stdin 2>&1 || true"),
              "echo === 2. PULL LATEST 180CORE BACKEND IMAGE ===",
              "docker pull ghcr.io/simplicion/180core-core-backend:latest",
              "echo === 3. STOP AND REMOVE OLD CONTAINER ===",
              "docker stop 180workspace-core-backend 2>/dev/null || true",
              "docker rm 180workspace-core-backend 2>/dev/null || true",
              "echo === 4. ENSURE DOCKER NETWORKS & SYNC OAUTH CONFIG ===",
              "docker network create app_180workspace-net 2>/dev/null || true",
              "docker network create 180workspace-net 2>/dev/null || true",
              ("if [ -n " + ($googleId | @sh) + " ]; then sed -i \"s/^GOOGLE_CLIENT_ID=.*/GOOGLE_CLIENT_ID=\"$googleId\"/\" /home/ubuntu/app/.env 2>/dev/null || true; fi"),
              ("if [ -n " + ($googleSecret | @sh) + " ]; then sed -i \"s/^GOOGLE_CLIENT_SECRET=.*/GOOGLE_CLIENT_SECRET=\"$googleSecret\"/\" /home/ubuntu/app/.env 2>/dev/null || true; fi"),
              "echo === 5. LAUNCH 180CORE BACKEND CONTAINER ===",
              ("docker run -d --name 180workspace-core-backend --restart always --network app_180workspace-net --network-alias core-backend -p 4003:4003 --add-host host.docker.internal:host-gateway --env-file /home/ubuntu/app/.env " + (if ($googleId | length) > 0 then "-e GOOGLE_CLIENT_ID=" + ($googleId | @sh) + " " else "" end) + (if ($googleSecret | length) > 0 then "-e GOOGLE_CLIENT_SECRET=" + ($googleSecret | @sh) + " " else "" end) + "-e PORT=4003 -e NODE_ENV=production -e REDIS_URL=redis://host.docker.internal:6379 -e REDIS_INTERNAL_URL=redis://host.docker.internal:6379 -e CORE_DATABASE_URL=" + ($coreDb | @sh) + " ghcr.io/simplicion/180core-core-backend:latest"),
              "docker network connect 180workspace-net 180workspace-core-backend --alias core-backend 2>/dev/null || true",
              "docker network connect app_180workspace-net 180workspace-proxy 2>/dev/null || true",
              "docker network connect 180workspace-net 180workspace-proxy 2>/dev/null || true",
              "echo === 6. WAIT FOR SERVER INITIALIZATION ===",
              "sleep 8",
              "echo === 7. DOCKER LOGS CORE-BACKEND ===",
              "docker logs --tail 40 180workspace-core-backend 2>&1 || true",
              "echo === 8. TEST LOCAL PORT 4003 ===",
              "curl -i http://localhost:4003/health 2>&1 || true",
              "echo === 9. NGINX UPSTREAM CONFIG ===",
              "cat /home/ubuntu/app/nginx/nginx.conf 2>&1 || true",
              "echo === 10. TEST AND RELOAD/RESTART NGINX PROXY ===",
              "docker exec 180workspace-proxy nginx -t 2>&1 || true",
              "docker restart 180workspace-proxy 2>&1 || docker start 180workspace-proxy 2>&1 || true",
              "sleep 4",
              "echo === 11. DOCKER PS STATUS ===",
              "docker ps --format \"table {{.Names}}\t{{.Status}}\t{{.Ports}}\"",
              "echo === 12. DOCKER LOGS PROXY ===",
              "docker logs --tail 25 180workspace-proxy 2>&1 || true",
              "echo === 13. TEST VIA NGINX ON PORT 80 ===",
              ("curl -i -H " + ($hostHdr | @sh) + " http://localhost/health 2>&1 || true")
            ]}')

          echo "Triggering zero-downtime reload on EC2..."
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters "$SSM_PARAMS" \
            --query "Command.CommandId" \
            --output text)
          
          echo "SSM Command dispatched: $COMMAND_ID"
          set +e
          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID"
          WAIT_STATUS=$?
          echo "=== SSM STDOUT ==="
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query "StandardOutputContent" --output text
          echo "=== SSM STDERR ==="
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query "StandardErrorContent" --output text
          if [ $WAIT_STATUS -ne 0 ]; then
            echo "❌ Backend healthcheck failed after restart."
            exit $WAIT_STATUS
          fi
          echo "✅ Backend successfully restarted and verified healthy."

      - name: Verify Public Edge Healthcheck
        run: |
          echo "Testing public ingress endpoint..."
          for i in {1..10}; do
            echo "Attempt $i: Checking https://api.180core.cloud/health & origin..."
            if curl -sf https://api.180core.cloud/health || curl -sf -H "Host: api.180core.cloud" http://32.198.110.99/health; then
              echo "✅ Public ingress endpoint responded with 200 OK!"
              exit 0
            fi
            sleep 4
          done
          echo "Edge warming up..."

  deploy-developers-frontend:
    name: Deploy Developer Portal (Cloudflare Pages)
    needs: detect-changes
    if: needs.detect-changes.outputs.developers == 'true' || needs.detect-changes.outputs.global == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9.0.0

      - name: Setup Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install Monorepo Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Sovereign SDK Mirror
        run: pnpm build:sdk

      - name: Build Developers Frontend (Static Export)
        env:
          NODE_ENV: production
          CF_PAGES: 'true'
          NEXT_PUBLIC_CORE_BACKEND_URL: 'https://api.180core.cloud'
          NEXT_PUBLIC_API_URL: 'https://api.180core.cloud'
          NEXT_PUBLIC_PROFILE_URL: 'https://profile.180core.cloud'
        run: pnpm --filter 180developers-frontend build

      - name: Deploy to Cloudflare Pages (180workspace-developer)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] && [ -z "$CLOUDFLARE_API_KEY" ]; then
            echo "ℹ️ Neither CLOUDFLARE_API_TOKEN nor CLOUDFLARE_API_KEY configured. Skipping Cloudflare Pages upload."
            exit 0
          fi
          npx --yes wrangler pages deploy apps/180developers-frontend/out --project-name=180workspace-developer --commit-dirty=true

  deploy-profile-frontend:
    name: Deploy Profile & SSO Portal (Cloudflare Pages)
    needs: detect-changes
    if: needs.detect-changes.outputs.profile == 'true' || needs.detect-changes.outputs.global == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9.0.0

      - name: Setup Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install Monorepo Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Profile Frontend (Static Export)
        env:
          NODE_ENV: production
          CF_PAGES: 'true'
          NEXT_PUBLIC_CORE_BACKEND_URL: 'https://api.180core.cloud'
          NEXT_PUBLIC_CORE_API_URL: 'https://api.180core.cloud'
          NEXT_PUBLIC_DEVELOPERS_URL: 'https://developer.180core.cloud'
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${{ secrets.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
          NEXT_PUBLIC_ROOT_DOMAIN: '180core.cloud'
          NEXT_PUBLIC_MAIN_DOMAIN: '180core.cloud'
        run: pnpm --filter 180-profile-frontend build

      - name: Deploy to Cloudflare Pages (180workspace-profile)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] && [ -z "$CLOUDFLARE_API_KEY" ]; then
            echo "ℹ️ Neither CLOUDFLARE_API_TOKEN nor CLOUDFLARE_API_KEY configured. Skipping Cloudflare Pages upload."
            exit 0
          fi
          npx --yes wrangler pages deploy apps/180-profile-frontend/out --project-name=180workspace-profile --commit-dirty=true

  deploy-admin-frontend:
    name: Deploy Super Admin Platform (Cloudflare Pages)
    needs: detect-changes
    if: needs.detect-changes.outputs.admin == 'true' || needs.detect-changes.outputs.global == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9.0.0

      - name: Setup Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install Monorepo Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Admin Frontend (Static Export)
        env:
          NODE_ENV: production
          CF_PAGES: 'true'
          NEXT_PUBLIC_ADMIN_API_URL: 'https://api.180core.cloud/api/v1/admin'
          NEXT_PUBLIC_SUPPORT_API_URL: 'https://api.180core.cloud/api/v1/support'
        run: pnpm --filter 180-admin-frontend build

      - name: Deploy to Cloudflare Pages (180core-admin)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] && [ -z "$CLOUDFLARE_API_KEY" ]; then
            echo "ℹ️ Neither CLOUDFLARE_API_TOKEN nor CLOUDFLARE_API_KEY configured. Skipping Cloudflare Pages upload."
            exit 0
          fi
          npx --yes wrangler pages deploy apps/180-admin-frontend/out --project-name=180core-admin --commit-dirty=true

